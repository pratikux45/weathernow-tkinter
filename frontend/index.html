<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WeatherNow — Live weather, forecasts &amp; trends</title>
<meta name="description" content="A modern weather dashboard: current conditions, hourly and 5-day forecasts, and trend charts for any city." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤️</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="sky__glow sky__glow--a"></div>
  <div class="sky__glow sky__glow--b"></div>
</div>

<div class="app">

  <!-- ===================== HEADER ===================== -->
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__logo" aria-hidden="true">🌤️</span>
      <span class="topbar__name">WeatherNow</span>
    </div>

    <form class="topbar__search" id="searchForm" role="search" autocomplete="off">
      <svg class="topbar__search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
        <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="cityInput" type="text" placeholder="Search a city…" aria-label="Search for a city" />
      <button type="submit" class="topbar__search-btn">Search</button>
    </form>

    <div class="topbar__actions">
      <button id="locationBtn" class="iconbtn" title="Use my location" aria-label="Use my current location">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="6" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="1.6" fill="currentColor"/>
        </svg>
      </button>
      <button id="themeToggle" class="iconbtn" title="Toggle dark / light theme" aria-label="Toggle theme">
        <span id="themeIcon" aria-hidden="true">🌙</span>
      </button>
    </div>
  </header>

  <main class="layout">

    <!-- ===================== LEFT / MAIN COLUMN ===================== -->
    <section class="main-col">

      <!-- Status banners -->
      <div id="errorBanner" class="banner banner--error" hidden role="alert">
        <span class="banner__icon">⚠</span>
        <span id="errorText"></span>
        <button id="errorDismiss" class="banner__close" aria-label="Dismiss">✕</button>
      </div>

      <!-- Hero current-weather card -->
      <div id="heroCard" class="card hero">
        <div id="heroSkeleton" class="skeleton hero__skeleton">
          <div class="skeleton__line skeleton__line--wide"></div>
          <div class="skeleton__circle"></div>
          <div class="skeleton__line skeleton__line--big"></div>
          <div class="skeleton__line"></div>
        </div>

        <div id="heroContent" class="hero__content" hidden>
          <div class="hero__top">
            <div>
              <h1 id="heroCity" class="hero__city">—</h1>
              <p id="heroUpdated" class="hero__updated">—</p>
            </div>
            <div class="hero__icon-wrap">
              <img id="heroIcon" class="hero__icon" src="" alt="" width="88" height="88" />
            </div>
          </div>

          <div class="hero__main">
            <span id="heroTemp" class="hero__temp">--°</span>
            <div class="hero__meta">
              <p id="heroDesc" class="hero__desc">—</p>
              <p id="heroFeels" class="hero__feels">—</p>
              <p id="heroRange" class="hero__range">—</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Stats grid -->
      <section aria-label="Weather details">
        <div id="statsGrid" class="stats-grid">
          <!-- populated by JS -->
        </div>
      </section>

      <!-- Daily forecast strip -->
      <section class="card section" aria-label="5-day forecast">
        <h2 class="section__title">5-Day Forecast</h2>
        <div id="dailyStrip" class="daily-strip"></div>
      </section>

      <!-- Hourly forecast -->
      <section class="card section" aria-label="Hourly forecast">
        <h2 class="section__title">Hourly Forecast</h2>
        <div id="hourlyScroll" class="hourly-scroll"></div>
      </section>

      <!-- Charts -->
      <section class="card section" aria-label="Weather trends">
        <h2 class="section__title">Trends</h2>
        <div class="charts-grid">
          <div class="chart-box">
            <p class="chart-box__label">Temperature (°)</p>
            <canvas id="tempChart" height="160"></canvas>
          </div>
          <div class="chart-box">
            <p class="chart-box__label">Humidity vs. Precipitation chance (%)</p>
            <canvas id="humidChart" height="160"></canvas>
          </div>
        </div>
      </section>

    </section>

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="side-col">
      <section class="card section">
        <div class="section__header">
          <h2 class="section__title">Recent Searches</h2>
          <button id="clearHistoryBtn" class="linkbtn">Clear all</button>
        </div>
        <ul id="historyList" class="history-list">
          <li class="history-empty" id="historyEmpty">No searches yet — try looking up a city.</li>
        </ul>
      </section>
    </aside>

  </main>

  <footer class="footer">
    <p>Weather data from OpenWeatherMap · Built with FastAPI</p>
  </footer>
</div>

<template id="statCardTemplate">
  <div class="stat-card">
    <span class="stat-card__icon"></span>
    <div class="stat-card__body">
      <p class="stat-card__label"></p>
      <p class="stat-card__value"></p>
      <p class="stat-card__sub"></p>
    </div>
  </div>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
